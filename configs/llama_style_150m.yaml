# LLaMA-style profile (~150M params): RoPE + GQA + RMSNorm + SwiGLU.
# The modern default baseline against which single-change ablations run.
model:
  d_model: 1024
  n_layers: 12
  vocab_size: 32000
  max_seq_len: 4096
  bias: false
  dropout: 0.0
  tie_embeddings: true
  attention:
    kind: gqa
    n_heads: 16
    n_kv_heads: 4
  position:
    kind: rope
    rope_theta: 500000.0
    rope_style: half
  ffn:
    kind: swiglu
    multiple_of: 256
  norm:
    kind: rmsnorm
    placement: pre
    eps: 1.0e-5
  init:
    scheme: fixed
    std: 0.02
    scaled_residual: true
train:
  # bf16 needs Ampere or newer. On the local GTX 1660 Ti use fp16 instead.
  precision: fp16
  lr: 3.0e-4
  schedule: cosine
  warmup_steps: 200
  max_steps: 2000
  micro_batch_size: 8
  grad_accum_steps: 2
  seq_len: 512
